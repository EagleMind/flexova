name: Release

# On main: if changesets are pending, open or update the "Version packages" pull request. Once that pull
# request merges, publish every package version that is not on npm yet, then the Python package and the
# Docker image. No registry tokens are stored: npm and PyPI use trusted publishing (OIDC).
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  npm:
    name: npm (Changesets)
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and git tags
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing and provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: node scripts/publish.mjs
          createGithubReleases: true
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: PyPI
    needs: npm
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Is this version already on PyPI?
        id: check
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/flexova/${version}/json")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$status" = 404 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.publish == 'true'
        run: python3 -m pip install build && python3 -m build python --outdir dist
      - if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Docker image (ghcr.io)
    needs: npm
    if: needs.npm.outputs.published == 'true' && contains(needs.npm.outputs.packages, '"@flexova/cli"')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flexova-cli:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/flexova-cli:latest
