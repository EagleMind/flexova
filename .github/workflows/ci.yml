name: CI

on:
  # Every branch push runs, so stacked milestone branches get checks (their PRs show them too).
  push:
  # Only pull requests from forks run here; same-repo PRs already have their push run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @flexova/import tests convert a DOCX sample through Pandoc.
      - run: sudo apt-get install -y --no-install-recommends pandoc
      - run: pnpm lint
      - run: pnpm format:check
      # Packages consume each other's built output, so build (in dependency order) before typecheck and tests.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @flexova/viewer size

  python:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Python (stdlib only)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest
        run: PYTHONPATH=python/src python -m unittest discover -s python/tests -v

  docker:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Docker image (build and convert a DOCX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flexova-cli .
      - run: docker run --rm -v "$PWD/samples:/work:ro" flexova-cli build docx/field-guide.docx --lang en --strict -o /tmp/guide.flexova
      - run: docker run --rm flexova-cli --version
